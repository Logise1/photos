<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viaje a Granada, Sevilla y Córdoba</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        .photo-card {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .photo-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            z-index: 10;
        }

        img {
            transition: opacity 0.6s ease-in-out, transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .photo-card:hover img {
            transform: scale(1.08); /* Efecto de zoom suave al pasar el ratón */
        }

        img[loading] {
            opacity: 0;
        }

        img.loaded {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-20">
        <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight text-slate-900 mb-2">
                Viaje a Granada, Sevilla y Córdoba
            </h1>
            <p class="text-lg md:text-xl text-slate-500 font-medium">
                Fotos por Ariel Capdevila
            </p>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto py-10 px-4 sm:px-6 lg:px-8 w-full">
        <!-- Grid adaptable: 1 col móvil, 2 tablet, 3/4 en escritorio -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="gallery-container">
            <!-- Las imágenes se insertarán aquí dinámicamente -->
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 mt-auto">
        <div class="max-w-7xl mx-auto py-6 px-4 text-center text-slate-400 text-sm">
            &copy; 2026 Ariel Capdevila. Todos los derechos reservados.
        </div>
    </footer>

    <script>
        // Lista limpia de archivos de imágenes
        const photoFilenames = [
            "PXL_20260508_095015759.MP.jpg",
            "PXL_20260508_093934021.PANO.jpg",
            "PXL_20260508_093705949.PANO.jpg", 
            "PXL_20260508_093657441.MP.jpg",
            "PXL_20260508_092321816.MP.jpg",
            "PXL_20260508_091943629.PANO.jpg",
            "PXL_20260508_090447208.MP.jpg",
            "PXL_20260507_130513808.MP.jpg",
            "PXL_20260507_112540074.MP.jpg",
            "PXL_20260507_110403628.MP.jpg",
            "PXL_20260507_102747094.MP.jpg",
            "PXL_20260507_102545234.MP.jpg",
            "PXL_20260507_101945365.MP.jpg",
            "PXL_20260505_093459700.MP~2.jpg",
            "PXL_20260505_092908379.MP.jpg",
            "PXL_20260505_091513304.MP.jpg",
            "PXL_20260505_091231719.MP.jpg",
            "PXL_20260505_085837433.MP.jpg",
            "PXL_20260505_081340102.MP.jpg",
            "PXL_20260505_082307518.MP.jpg"
        ];

        // URL base confirmada
        const baseUrl = "https://logise1.github.io/photos/";
        
        // Limpiamos posibles duplicados en la lista de arrays
        const uniquePhotos = [...new Set(photoFilenames)];
        const galleryContainer = document.getElementById('gallery-container');

        function renderGallery() {
            uniquePhotos.forEach(filename => {
                // Crear el contenedor de cada imagen con un aspect-ratio cuadrado perfecto
                const card = document.createElement('div');
                card.className = 'photo-card rounded-xl overflow-hidden bg-slate-200 relative aspect-square cursor-pointer group shadow-sm';
                
                // Concatenamos la URL base con el nombre del archivo (Ej: https://logise1.github.io/photos/PXL_...jpg)
                const imageUrl = `${baseUrl}${filename}`;

                // Crear elemento de imagen
                const img = document.createElement('img');
                img.src = imageUrl;
                img.alt = `Foto de viaje: ${filename}`;
                img.loading = "lazy";
                img.className = 'object-cover w-full h-full absolute inset-0 z-0';
                
                // Mostrar la imagen suavemente cuando esté lista
                img.onload = function() {
                    this.classList.add('loaded');
                };

                // Si por alguna razón falla una URL específica
                img.onerror = function() {
                    this.src = `https://placehold.co/600x600/cbd5e1/475569?text=Imagen+No+Disponible`;
                    this.alt = "Imagen no disponible";
                    this.classList.add('loaded');
                };

                // Overlay oscuro que aparece al pasar el ratón para leer el nombre del archivo
                const overlay = document.createElement('div');
                overlay.className = 'absolute inset-0 bg-gradient-to-t from-slate-900/80 via-slate-900/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-10 flex flex-col justify-end p-4';
                
                const title = document.createElement('span');
                title.className = 'text-white/90 text-xs font-mono break-all leading-tight';
                title.textContent = filename;
                
                overlay.appendChild(title);

                // Ensamblar
                card.appendChild(img);
                card.appendChild(overlay);
                galleryContainer.appendChild(card);
            });
        }

        // Ejecutar el renderizado
        renderGallery();
    </script>
</body>
</html>
